version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kb_cruvels_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kb_cruvels
      POSTGRES_USER: kb_user
      POSTGRES_PASSWORD: kb_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb_user -d kb_cruvels"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kb_cruvels_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://kb_user:kb_password@postgres:5432/kb_cruvels
      KB_DATA_ROOT: /app/data
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
